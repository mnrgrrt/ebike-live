name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests
        run: gradle :core:testDebugUnitTest --stacktrace
      - name: Build APKs
        run: gradle :phone:assembleDebug :wear:assembleDebug --stacktrace
      - name: Collect
        run: |
          mkdir out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/ebike-live-telefoon.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/ebike-live-horloge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk --title "eBike live (laatste build)" \
            --notes "Automatisch gebouwd uit ${GITHUB_SHA::7}" --latest
